name: 検査

# PR と main への push で、速い検査を流す（数分）。main の保護で「必須」にするのはこの job。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kensa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kensa:
    name: サーバの検査・字・秘密・知識
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 他言語の字が無いこと
        run: python3 app/tools/check-source.py
      - name: 秘密らしいものが無いこと
        run: python3 scripts/check/scan_secrets.py
      - name: 標準ライブラリと同じ名前の .py が無いこと
        run: python3 scripts/check/stdlib_shadow.py
      - name: 番人が止めるべきものを止め、読むだけのものを通すこと
        run: python3 scripts/check/test_guard.py
      - name: 知識の目次と先頭の表
        run: python3 scripts/brain/lint.py
      - name: サーバの検査（server/test_*.py を全部）
        run: |
          set +e +o pipefail   # 1 本が落ちても残りを流し、最後にまとめて赤にする
          fail=0
          for t in server/test_*.py; do
            n=$(basename "$t" .py)
            python3 "$t" > "$n.out" 2>&1; rc=$?
            last=$(tail -1 "$n.out")
            echo "$n exit=$rc | $last"
            # 判定は終わりの番号（各検査は失敗のとき 0 以外で終わる。test_syllabus は「問題 0」と書いて 0 で終わる）
            if [ "$rc" != 0 ] || grep -q "Traceback" "$n.out"; then fail=$((fail+1)); tail -20 "$n.out"; fi
          done
          [ "$fail" = 0 ]
