name: 画面の流れ

# 画面とサーバに触る PR のときだけ、Chrome で流れを押して確かめる（30 分ほど。無料枠を食うので毎晩は流さない）。
# WebKit（Safari と同じエンジン）と動画は Mac だけ。
on:
  pull_request:
    paths:
      - "app/**"
      - "server/**"
      - "scripts/check/**"
      - "カリキュラム/**"
  workflow_dispatch:

concurrency:
  group: nagare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  nagare:
    name: Chrome の流れ（6・13・15・16）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 日本語の書体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: 土台を作って流す（手元と同じ scripts/check/flows/run.sh で）
        env:
          TUBE_CHROME: /usr/bin/google-chrome
          FLOWS: adm_flow6 adm_flow13 adm_flow15 adm_flow16
        run: |
          S="$RUNNER_TEMP/W"; mkdir -p "$S"; cp -R "$GITHUB_WORKSPACE" "$S/tube"
          # 1 本が落ちても run.sh は残りを流し、最後に 0 以外で終わる。赤にするのは最後の段
          if sh scripts/check/flows/run.sh "$S" chrome; then echo "FAIL=0" >> "$GITHUB_ENV"; else echo "FAIL=1" >> "$GITHUB_ENV"; fi
      - name: 写しを残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 写しと記録
          path: |
            ${{ runner.temp }}/W/shots*
            ${{ runner.temp }}/W/flows-out
          if-no-files-found: ignore
      - name: 結果を PR に書く
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### 画面の流れ（Chrome）"
            cat "$RUNNER_TEMP/W/結果.md" 2>/dev/null || echo "（結果が無い。土台を作れなかった可能性）"
            # 通らなかった台本の × の行をここに写す（Artifacts と job の log は、クラウドの routine から 403 で読めない。10-26）
            for f in "$RUNNER_TEMP"/W/flows-out/*.out; do
              [ -f "$f" ] && grep -q -E '^ +× ' "$f" || continue
              echo ""; echo "<details><summary>$(basename "$f" .out) の ×</summary>"; echo ""; echo '```'
              grep -E '^ +× ' "$f" | head -20 | cut -c1-400
              echo '```'; echo "</details>"
            done
            echo ""
            echo "写しと記録は この実行の Artifacts「写しと記録」（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。WebKit と Safari の目視は Mac で。"
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true
      - name: 失敗があれば赤に
        run: '[ "${FAIL:-1}" = 0 ]'
